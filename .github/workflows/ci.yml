name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: make lint

  build-unix:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
          - name: macos
            os: macos-latest
            cc: clang

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            clang \
            libgtk-3-dev \
            libcurl4-openssl-dev \
            libayatana-appindicator3-dev \
            libcairo2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gtk+3 curl pkg-config

      - name: Build
        env:
          CC: ${{ matrix.cc }}
          CFLAGS: -O2 -Werror
        run: |
          make clean
          make

  build-windows:
    name: Build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-curl

      - name: Build
        shell: msys2 {0}
        env:
          CC: gcc
          CFLAGS: -O2 -Werror
        run: |
          make clean
          make
