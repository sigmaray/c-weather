name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libcurl4-openssl-dev \
            libayatana-appindicator3-dev \
            libcairo2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gtk+3 curl pkg-config

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-curl

      - name: Build
        env:
          CFLAGS: -O2 -Werror
        run: |
          make clean
          make

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          arch="$(uname -m)"
          case "${{ runner.os }}" in
            macOS) out="c-weather-macos-${arch}" ;;
            *)     out="c-weather-linux-${arch}" ;;
          esac
          cp c-weather "$out"
          chmod +x "$out"
          echo "ASSET_NAME=$out" >> "$GITHUB_ENV"

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: |
          out="c-weather-windows-x86_64.exe"
          cp c-weather.exe "$out"
          echo "ASSET_NAME=$out" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          tag="main-${short_sha}"
          title="main @ ${short_sha}"
          body="$(printf '%s\n\nCommit: %s\n\nBinaries are dynamically linked; install GTK 3, libcurl, and (on Linux) Ayatana AppIndicator to run.\nmacOS/Windows builds use a stub AppIndicator (no tray icon).' \
            "$(git log -1 --pretty=%B)" "${GITHUB_SHA}")"

          ls -la dist/
          gh release create "$tag" dist/* \
            --title "$title" \
            --notes "$body" \
            --target "${GITHUB_SHA}"
